version: 1
algorithms:
  # Pedestal 64 at 10 bit (sensor module black level 64 on R/Gr/Gb/B; measured
  # 63.96 on dark frames), given here as a 16-bit value.
  - BlackLevel:
      blackLevel: 4096
  - Awb:
